[project]
name = "natulim-demo-marcosbolo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Marcosbit93", email = "marcos93bolonese@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "certifi>=2026.7.22",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "tenacity>=9.1.4",
    "truststore>=0.10.4",
]

[project.scripts]
natulim-demo-marcosbolo = "natulim_demo_marcosbolo:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
